<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>IDE 账号桥接</title>
<style>
  :root {
    color-scheme: light;
    --ink: #2c3440;
    --ink-soft: #667085;
    --line: #e3e8f0;
    --accent: #4a6cf7;
    --ok: #12805c;
    --warn: #b8860b;
    --err: #c0392b;
    --card: #ffffff;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    padding: 18px 20px 32px;
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    background: #f4f6fb;
    color: var(--ink);
    font-size: 13px;
    line-height: 1.55;
  }
  h1 { font-size: 16px; margin: 0 0 4px; }
  .sub { color: var(--ink-soft); margin: 0 0 16px; font-size: 12px; }
  .bar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  button {
    font: inherit;
    padding: 6px 14px;
    border-radius: 7px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { filter: brightness(1.08); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .card.off { opacity: .62; }
  .head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .name { font-weight: 600; }
  .tag {
    font-size: 11px;
    padding: 1px 7px;
    border-radius: 20px;
    border: 1px solid var(--line);
    color: var(--ink-soft);
  }
  .tag.ok { color: var(--ok); border-color: #b7e0cf; background: #f0faf6; }
  .tag.off { color: var(--warn); border-color: #f0e0b8; background: #fdf8ea; }
  .row { display: flex; gap: 8px; align-items: center; margin: 6px 0; }
  .label { color: var(--ink-soft); min-width: 68px; flex: none; }
  code {
    font-family: Consolas, "Cascadia Mono", monospace;
    font-size: 12px;
    background: #f2f4f8;
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 2px 7px;
    word-break: break-all;
    flex: 1;
    min-width: 0;
  }
  .copy { flex: none; padding: 2px 10px; font-size: 12px; }
  .models {
    margin-top: 8px;
    font-size: 12px;
    color: var(--ink-soft);
    max-height: 132px;
    overflow: auto;
    border-top: 1px dashed var(--line);
    padding-top: 8px;
  }
  .models span {
    display: inline-block;
    background: #f2f4f8;
    border-radius: 5px;
    padding: 1px 7px;
    margin: 2px 4px 2px 0;
    color: var(--ink);
  }
  .out {
    white-space: pre-wrap;
    font-family: Consolas, "Cascadia Mono", monospace;
    font-size: 12px;
    background: #fbfcfe;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px 14px;
    min-height: 40px;
    max-height: 300px;
    overflow: auto;
  }
  .hint { color: var(--ink-soft); font-size: 12px; margin-top: 6px; }
  .hint ol { margin: 6px 0 0; padding-left: 20px; }
</style>
</head>
<body>
  <h1>IDE 账号桥接</h1>
  <p class="sub">复用本机已登录的 Qoder / Trae 账号，向 Cyrene 提供 OpenAI 兼容的本地端点。</p>

  <div class="bar">
    <button class="primary" id="refresh">刷新状态</button>
    <button id="usage">查询额度</button>
    <button id="checkin">领取今日签到</button>
  </div>

  <div id="regions"></div>

  <div class="card">
    <div class="head"><span class="name">输出</span></div>
    <div class="out" id="out">就绪。点「刷新状态」读取各区域端点。</div>
    <div class="hint">
      在 Cyrene 里配置：设置 → 模型 → 新增模型档案，协议选 <b>OpenAI 兼容</b>，
      Base URL 与 token 填上面卡片给出的值，模型 ID 填对应区域列出的 ID。
    </div>
  </div>

  <script src="panel.js"></script>
</body>
</html>
